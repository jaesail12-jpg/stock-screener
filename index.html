<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>주식 조건 검색 & 재무 차트 스크리너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js 라이브러리 추가 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-900">주식 스크리너</h1>
        <p class="text-sm text-slate-500 mt-1">종목을 클릭하면 최근 연간 매출액/영업이익 추이 차트가 표시됩니다.</p>
      </div>
      <div id="lastUpdated" class="text-xs text-slate-400">데이터 로딩 중...</div>
    </header>

    <!-- 조건 필터 파트 -->
    <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">종목명 / 코드</label>
          <input type="text" id="searchInput" placeholder="예: 삼성전자, 005930" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">최소 시가총액 (억원)</label>
          <input type="number" id="minMarcapInput" placeholder="0" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">최대 PER (배)</label>
          <input type="number" id="maxPerInput" placeholder="이하 (예: 15)" step="0.1" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">최대 PBR (배)</label>
          <input type="number" id="maxPbrInput" placeholder="이하 (예: 1.5)" step="0.1" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">최소 영업이익률 (%)</label>
          <input type="number" id="minMarginInput" placeholder="이상 (예: 5)" step="0.1" class="w-full text-sm p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
      </div>

      <div class="flex justify-between items-center pt-2">
        <span id="resultCount" class="text-sm font-medium text-slate-600">검색 결과: 0건</span>
        <button id="resetBtn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-md transition">필터 초기화</button>
      </div>
    </section>

    <!-- 데이터 테이블 -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-100 text-slate-600 text-xs uppercase border-b">
            <tr>
              <th class="py-3 px-3">종목명</th>
              <th class="py-3 px-3">코드</th>
              <th class="py-3 px-3">시장</th>
              <th class="py-3 px-3 text-right">현재가</th>
              <th class="py-3 px-3 text-right">등락률</th>
              <th class="py-3 px-3 text-right">시가총액(억)</th>
              <th class="py-3 px-3 text-right">PER</th>
              <th class="py-3 px-3 text-right">PBR</th>
              <th class="py-3 px-3 text-right">최근 매출액(억)</th>
              <th class="py-3 px-3 text-right">최근 영업이익(억)</th>
              <th class="py-3 px-3 text-right">영업이익률</th>
            </tr>
          </thead>
          <tbody id="stockTableBody" class="divide-y divide-slate-100">
            <tr>
              <td colspan="11" class="text-center py-8 text-slate-400">데이터를 불러오는 중입니다...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- 차트 팝업 모달 -->
  <div id="chartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-3xl w-full p-6 space-y-4 shadow-2xl relative">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h2 id="modalStockName" class="text-xl font-bold text-slate-900">종목명</h2>
          <p id="modalStockCode" class="text-xs text-slate-400 font-mono"></p>
        </div>
        <button id="closeModalBtn" class="text-slate-400 hover:text-slate-600 text-2xl font-bold px-2">&times;</button>
      </div>
      <div class="relative h-80 w-full">
        <canvas id="financialChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    let stockData = [];
    let chartInstance = null;

    const searchInput = document.getElementById('searchInput');
    const minMarcapInput = document.getElementById('minMarcapInput');
    const maxPerInput = document.getElementById('maxPerInput');
    const maxPbrInput = document.getElementById('maxPbrInput');
    const minMarginInput = document.getElementById('minMarginInput');
    const resetBtn = document.getElementById('resetBtn');
    const stockTableBody = document.getElementById('stockTableBody');
    const resultCount = document.getElementById('resultCount');
    const lastUpdated = document.getElementById('lastUpdated');

    const chartModal = document.getElementById('chartModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalStockName = document.getElementById('modalStockName');
    const modalStockCode = document.getElementById('modalStockCode');

    async function loadStockData() {
      try {
        const response = await fetch('stocks.json?v=' + new Date().getTime());
        if (!response.ok) throw new Error('stocks.json 로드 실패');
        const data = await response.json();
        
        stockData = data.stocks || [];
        if (data.updated_at) lastUpdated.textContent = `최종 업데이트: ${data.updated_at}`;
        
        renderTable(stockData);
      } catch (error) {
        stockTableBody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-red-500">데이터 로드 실패: ${error.message}</td></tr>`;
      }
    }

    function filterStocks() {
      const query = searchInput.value.trim().toLowerCase();
      const minMarcap = parseFloat(minMarcapInput.value) || 0;
      const maxPer = maxPerInput.value !== '' ? parseFloat(maxPerInput.value) : Infinity;
      const maxPbr = maxPbrInput.value !== '' ? parseFloat(maxPbrInput.value) : Infinity;
      const minMargin = minMarginInput.value !== '' ? parseFloat(minMarginInput.value) : -Infinity;

      const filtered = stockData.filter(item => {
        const matchQuery = item.name.toLowerCase().includes(query) || item.code.includes(query);
        const matchMarcap = (item.marcap || 0) >= minMarcap;
        const matchPer = maxPer === Infinity ? true : (item.per !== null && item.per <= maxPer);
        const matchPbr = maxPbr === Infinity ? true : (item.pbr !== null && item.pbr <= maxPbr);
        const matchMargin = minMargin === -Infinity ? true : (item.recent_op_margin !== null && item.recent_op_margin >= minMargin);
        return matchQuery && matchMarcap && matchPer && matchPbr && matchMargin;
      });

      renderTable(filtered);
    }

    function renderTable(data) {
      resultCount.textContent = `검색 결과: ${data.length.toLocaleString()}건`;
      if (data.length === 0) {
        stockTableBody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-slate-400">조건에 일치하는 종목이 없습니다.</td></tr>`;
        return;
      }
      stockTableBody.innerHTML = data.map((item, index) => {
        const changeColor = item.change_rate > 0 ? 'text-red-500' : item.change_rate < 0 ? 'text-blue-500' : 'text-slate-600';
        const changeSign = item.change_rate > 0 ? '+' : '';

        return `
          <tr onclick="openChartModal('${item.code}')" class="hover:bg-blue-50/50 cursor-pointer transition">
            <td class="py-3 px-3 font-semibold text-slate-900">${item.name}</td>
            <td class="py-3 px-3 text-xs font-mono text-slate-400">${item.code}</td>
            <td class="py-3 px-3 text-xs">
              <span class="px-2 py-0.5 rounded ${item.market === 'KOSPI' ? 'bg-orange-50 text-orange-600 border border-orange-200' : 'bg-purple-50 text-purple-600 border border-purple-200'}">
                ${item.market}
              </span>
            </td>
            <td class="py-3 px-3 text-right font-medium">${item.price ? item.price.toLocaleString() : '-'}원</td>
            <td class="py-3 px-3 text-right font-semibold ${changeColor}">${changeSign}${item.change_rate ? item.change_rate.toFixed(2) : '0.00'}%</td>
            <td class="py-3 px-3 text-right">${item.marcap ? Math.round(item.marcap).toLocaleString() : '-'}</td>
            <td class="py-3 px-3 text-right">${item.per ? item.per.toFixed(2) : '-'}</td>
            <td class="py-3 px-3 text-right">${item.pbr ? item.pbr.toFixed(2) : '-'}</td>
            <td class="py-3 px-3 text-right font-medium text-slate-700">${item.recent_revenue ? Math.round(item.recent_revenue).toLocaleString() : '-'}</td>
            <td class="py-3 px-3 text-right font-medium text-slate-700">${item.recent_op_income ? Math.round(item.recent_op_income).toLocaleString() : '-'}</td>
            <td class="py-3 px-3 text-right font-medium text-blue-600">${item.recent_op_margin ? item.recent_op_margin.toFixed(2) + '%' : '-'}</td>
          </tr>
        `;
      }).join('');
    }

    // 차트 모달 열기
    window.openChartModal = function(code) {
      const stock = stockData.find(s => s.code === code);
      if (!stock || !stock.history) return;

      modalStockName.textContent = stock.name;
      modalStockCode.textContent = stock.code;

      const history = stock.history;
      const ctx = document.getElementById('financialChart').getContext('2d');

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: history.years,
          datasets: [
            {
              label: '매출액 (억원)',
              data: history.revenues,
              backgroundColor: 'rgba(59, 130, 246, 0.7)',
              yAxisID: 'y'
            },
            {
              label: '영업이익 (억원)',
              data: history.op_incomes,
              backgroundColor: 'rgba(16, 185, 129, 0.7)',
              yAxisID: 'y'
            },
            {
              label: '영업이익률 (%)',
              data: history.op_margins,
              type: 'line',
              borderColor: 'rgba(239, 68, 68, 1)',
              borderWidth: 3,
              pointBackgroundColor: 'rgba(239, 68, 68, 1)',
              yAxisID: 'y1'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: {
              type: 'linear',
              position: 'left',
              title: { display: true, text: '금액 (억원)' }
            },
            y1: {
              type: 'linear',
              position: 'right',
              title: { display: true, text: '비율 (%)' },
              grid: { drawOnChartArea: false }
            }
          }
        }
      });

      chartModal.classList.remove('hidden');
    };

    closeModalBtn.addEventListener('click', () => chartModal.classList.add('hidden'));
    chartModal.addEventListener('click', (e) => { if (e.target === chartModal) chartModal.classList.add('hidden'); });

    [searchInput, minMarcapInput, maxPerInput, maxPbrInput, minMarginInput].forEach(el => el.addEventListener('input', filterStocks));
    resetBtn.addEventListener('click', () => {
      searchInput.value = ''; minMarcapInput.value = ''; maxPerInput.value = ''; maxPbrInput.value = ''; minMarginInput.value = '';
      renderTable(stockData);
    });

    loadStockData();
  </script>
</body>
</html>
