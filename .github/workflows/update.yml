name: Update Stock Data Automatically

on:
  schedule:
    - cron: '30 7 * * 1-5' # KST 기준 평일 오후 4시 30분 자동 실행
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas pykrx finance-datareader requests

      - name: 주식 데이터 수집 스크립트 실행
        run: python collector.py

      - name: 갱신된 stocks.json 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stocks.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 자동 주식 데이터 업데이트" && git push)
